# Toolchain pins for Billionaire City Tycoon.
# Install Rokit once (https://github.com/rojo-rbx/rokit), then run `rokit install` in this folder.
# CI uses the same pins, so "works on my machine" means "works in CI".

[tools]
rojo = "rojo-rbx/rojo@7.5.1"
stylua = "JohnnyMorganz/StyLua@2.1.0"
selene = "Kampfkarren/selene@0.28.0"
lune = "lune-org/lune@0.8.9"
